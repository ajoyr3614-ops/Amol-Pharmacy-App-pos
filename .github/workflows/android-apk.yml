
name: Build Amol Pharmacy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'amol-pharmacy-management.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip amol-pharmacy-management.zip -d project

      - name: Fix Kotlin source errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("project/android/app/src/main/java/com/amol/pharmacy/ui/screens")

          for name in ["PosSalesScreen.kt", "SummaryScreen.kt"]:
              path = base / name
              source = path.read_text()
              source = source.replace("() => Unit", "() -> Unit")
              path.write_text(source)

          path = base / "PosSalesScreen.kt"
          source = path.read_text()
          source = source.replace("product.salePrice", "product.salePricePerPiece")

          extension = """
          
          private fun Double.format(digits: Int): String =
              String.format(java.util.Locale.US, "%.${digits}f", this)
          """

          if "private fun Double.format(" not in source:
              source += extension

          path.write_text(source)
          print("Kotlin fixes applied.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: project/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amol-Pharmacy-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
